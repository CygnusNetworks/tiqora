<!doctype html>
<!--
  Source of docs/images/og-image.png (social preview for the product site and the
  GitHub repository, 1280x640). Regenerate after changing it:
    node site/render-og-image.mjs
  Not deployed; the Pages workflow copies only the PNG.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        position: relative;
        font-family: Inter, system-ui, sans-serif;
        color: #e7eaf2;
        background:
          radial-gradient(900px 520px at 100% 0%, rgba(91, 140, 255, 0.22), transparent 60%),
          #0e1015;
        -webkit-font-smoothing: antialiased;
      }
      .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      .brand svg { width: 52px; height: 52px; }
      h1 { margin: 48px 0 0; font-size: 56px; line-height: 1.05; font-weight: 800; letter-spacing: -2px; }
      h1 em { font-style: normal; color: #5b8cff; }
      p { margin: 24px 0 0; font-size: 25px; line-height: 1.4; color: #aab2c3; }
      .chips { position: absolute; left: 72px; bottom: 60px; width: 560px; display: flex; flex-wrap: wrap; gap: 10px; }
      .chip {
        font-size: 18px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
        border: 1px solid #2c3446; background: #151821; color: #c9cfdc;
      }
      .shot {
        position: absolute; left: 700px; top: 72px; width: 820px;
        border-radius: 16px; overflow: hidden;
        border: 1px solid #2c3446;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 8px rgba(91, 140, 255, 0.06);
      }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="10" y="14" width="44" height="9" rx="4.5" fill="#5B8CFF" />
          <rect x="10" y="28" width="32" height="9" rx="4.5" fill="#4A5470" />
          <rect x="10" y="42" width="22" height="9" rx="4.5" fill="#333B52" />
        </svg>
        tiqora
      </div>
      <h1>The modern helpdesk for your <em>OTRS/Znuny</em> database.</h1>
      <p>Runs next to Znuny on the same data.<br />No big&#8209;bang migration.</p>
    </div>
    <div class="chips">
      <span class="chip">Self-hosted</span>
      <span class="chip">AGPL-3.0</span>
      <span class="chip">AI with PII masking</span>
    </div>
    <div class="shot"><img src="../docs/images/agent-ai-assist-dark.png" alt="" /></div>
  </body>
</html>
