# Negative fixture: the Pages/Sections layout the CMDB plan assumed for Znuny 7.x. The ITSM
# behaviour survey found no such layout (6.5 and 7.3 store a plain attribute list), so the
# shared parser rejects it (test_seven_x_sections_document_is_not_a_definition).
Pages:
  - Name: General
    Sections:
      - Section: Main
Sections:
  Main:
    Content:
      - Key: Vendor
        Name: Vendor
        Searchable: 1
        Input:
          Type: Text
          MaxLength: 50
      - Key: Model
        Name: Model
        Searchable: 1
        Input:
          Type: Text
      - Key: Description
        Name: Description
        Input:
          Type: TextArea
  Hardware:
    Content:
      - Key: SerialNumber
        Name: Serial number
        Searchable: 1
        Input:
          Type: Text
          Required: 1
      - Key: Memory
        Name: Memory (GB)
        Input:
          Type: Integer
          ValueMin: 1
          ValueMax: 4096
