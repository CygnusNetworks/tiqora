name: Feature request
description: Suggest something Tiqora should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Znuny feature parity list](https://github.com/CygnusNetworks/tiqora/blob/main/docs/compatibility.md#znuny-features-not-implemented)
        first — it may already be planned. Open ideas can also start in
        [Discussions](https://github.com/CygnusNetworks/tiqora/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and where it hurts today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: input
    id: znuny
    attributes:
      label: Does Znuny/OTRS have this? Where?
      placeholder: Agent → Tickets → Search → "Save as template"
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
