name: Docker

# Day-to-day (push to main): native linux/amd64 only — fast, no QEMU.
# Release tags (v*): multi-arch linux/amd64 + linux/arm64.
# Manual dispatch can force multi-arch via the multiarch input.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      multiarch:
        description: "Build multi-arch (amd64 + arm64) even without a v* tag"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/cygnusnetworks/tiqora
  DOCKERHUB_IMAGE: cygnusnetworks/tiqora

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      # Docker Hub push is optional: it only happens when the secrets are configured.
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
      # Multi-arch on release tags, or when workflow_dispatch forces it.
      MULTIARCH: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.multiarch)) && 'true' || 'false' }}
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags so `git describe` can compute the tag distance.
          fetch-depth: 0

      - name: Compute version string
        id: version
        run: |
          echo "describe=$(git describe --tags --long --always 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Determine platforms
        id: platforms
        run: |
          if [ "${MULTIARCH}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "label=multi-arch (amd64+arm64)" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "label=amd64 only" >> "$GITHUB_OUTPUT"
          fi
          echo "Building for: $( [ "${MULTIARCH}" = "true" ] && echo multi-arch || echo amd64-only )"

      - name: Determine target images
        id: images
        run: |
          {
            echo 'list<<EOF'
            echo "${GHCR_IMAGE}"
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        if: env.MULTIARCH == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push (${{ steps.platforms.outputs.label }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.describe }}
            VITE_GIT_SHA=${{ github.sha }}
            TIQORA_VERSION=${{ steps.version.outputs.describe }}
            TIQORA_GIT_SHA=${{ github.sha }}
            TIQORA_BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render README for Docker Hub
        if: env.HAS_DOCKERHUB == 'true' && github.ref == 'refs/heads/main'
        run: |
          # Docker Hub has no base URL to resolve GitHub-relative links/images
          # against, so rewrite them to absolute GitHub URLs for the synced copy.
          sed -E \
            -e 's#!\[([^]]*)\]\(\./#![\1](https://raw.githubusercontent.com/CygnusNetworks/tiqora/main/#g' \
            -e 's#\]\(\./#](https://github.com/CygnusNetworks/tiqora/blob/main/#g' \
            README.md > README.dockerhub.md

      - name: Sync README to Docker Hub
        if: env.HAS_DOCKERHUB == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Self-hosted ticket/helpdesk system, database-compatible with OTRS 6.0.x / Znuny 6.0–7.3"
          readme-filepath: ./README.dockerhub.md
