name: Secret and personal-data scan

# Server-side backstop for .githooks (which can be skipped with --no-verify or
# a clone without core.hooksPath): gitleaks with the repo's .gitleaks.toml over
# the full history, plus the author/committer allowlist. Runs on every push and
# nightly, so a rule added later also covers what is already published.

on:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks + identities
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner -c .gitleaks.toml .
      - name: Only allowed identities
        run: |
          set -euo pipefail
          bad=$(git log --all --format='%an <%ae>%n%cn <%ce>' | sort -u \
            | grep -vxF -f <(grep -v '^#' .githooks/allowed-identities) || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits by identities not in .githooks/allowed-identities:"
            echo "$bad"
            exit 1
          fi
