name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Voreinstellung fuer alle Jobs: nur lesen. Einzelne Jobs, die mehr
# brauchen, deklarieren das selbst.
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src/tiqora

  # One job runs the whole suite. Both dialects are covered *within* a single
  # run: tests/conftest.py starts its own MariaDB and Postgres testcontainers
  # and parametrises the DB tests over both (162 mariadb + 152 postgres cells).
  # This used to be two near-identical jobs each running `pytest -q` over all
  # 1260 tests, so the split re-ran the entire suite -- including the 552 pure
  # unit tests -- for no extra coverage.
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # No `services:` block. The suite is self-sufficient: DB and search tests
    # start their own testcontainers, the three files that touch DATABASE_URL
    # set it themselves from that container's URL, and Redis is faked
    # in-process. MEILI_URL never had a service behind it either -- the search
    # tests boot getmeili/meilisearch themselves -- but the settings object
    # wants the vars present, so they stay.
    env:
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: tiqora-dev-master-key
      TIQORA_ENV: test
      # Fail if a module that is not in tests/db_leak_baseline.txt commits
      # rows without deleting them. Locally this is a warning instead.
      TIQORA_STRICT_DB_LEAKS: "1"
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install crypto tooling (gpg for PGP tests; openssl is preinstalled)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg
      - name: Install dependencies
        run: uv sync --extra dev --extra crypto
      # Coverage instrumentation adds wall time to every run; only release
      # tags consume the artifact (coverage-badges job), so plain pytest runs
      # on PRs/main and the instrumented variant runs only on v* tags.
      - name: Pytest
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: uv run pytest -q
      - name: Pytest (with coverage, for release-tag badge)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run pytest -q --cov=tiqora --cov-report=json:coverage.json
      - name: Upload coverage (for release-tag badge)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 7

  frontend:
    name: Frontend (lint, build, vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build api-client
        run: pnpm --filter @tiqora/api-client build
      - name: Lint
        run: pnpm --filter tiqora-frontend lint
      - name: Typecheck + build
        run: pnpm --filter tiqora-frontend build
      # v8 coverage instrumentation eats into vitest's per-test timeout margin
      # on every run, but only release tags consume the artifact — so run
      # plain vitest on PRs/main and the instrumented variant only on v* tags.
      - name: Vitest
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter tiqora-frontend test
      - name: Vitest (with coverage, for release-tag badge)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter tiqora-frontend test:coverage
      - name: Upload coverage (for release-tag badge)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 7
      # Playwright e2e only on release tags (hard fail). Everyday PR/main skips
      # saves ~4–5 min of runner time (install + full e2e suite).
      - name: Install Playwright Chromium
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter tiqora-frontend exec playwright install --with-deps chromium
      - name: Playwright e2e (mocked API)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter tiqora-frontend e2e

  coverage-badges:
    name: Publish coverage badges
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend-test, frontend]
    runs-on: ubuntu-latest
    # Serialise badge publishes so two release tags built close together don't
    # race the push to the badges branch (the workflow-level concurrency group
    # is keyed on github.ref, which differs per tag and so wouldn't serialise).
    concurrency:
      group: coverage-badges
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: backend-coverage
          path: cov/backend
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-coverage
          path: cov/frontend
      - name: Build badge JSON
        run: |
          set -euo pipefail
          mkdir -p /tmp/badges

          badge_color() {
            # $1 = coverage percent (integer)
            if [ "$1" -ge 80 ]; then echo "brightgreen"
            elif [ "$1" -ge 60 ]; then echo "yellow"
            else echo "red"
            fi
          }

          backend_pct=$(python3 -c "import json; print(round(json.load(open('cov/backend/coverage.json'))['totals']['percent_covered']))")
          frontend_pct=$(node -e "console.log(Math.round(require('./cov/frontend/coverage-summary.json').total.lines.pct))")

          for pair in "backend:$backend_pct" "frontend:$frontend_pct"; do
            name="${pair%%:*}"
            pct="${pair##*:}"
            color=$(badge_color "$pct")
            cat > "/tmp/badges/${name}-coverage.json" <<JSON
          {"schemaVersion":1,"label":"${name} coverage","message":"${pct}%","color":"${color}"}
          JSON
          done

          cat /tmp/badges/backend-coverage.json
          cat /tmp/badges/frontend-coverage.json
      - name: Publish to badges branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Distinguish "badges branch doesn't exist yet" (first run — an
          # orphan branch is correct) from a transient fetch failure. The old
          # `git fetch ... 2>/dev/null || git checkout --orphan` silently
          # turned any network blip into an orphan branch whose unforced push
          # was then rejected non-fast-forward, failing the release job.
          if git ls-remote --exit-code origin badges >/dev/null; then
            git fetch origin badges
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/badges/backend-coverage.json /tmp/badges/frontend-coverage.json .

          git add backend-coverage.json frontend-coverage.json
          if git diff --cached --quiet; then
            echo "No badge changes."
          else
            git commit -m "chore: update coverage badges for ${GITHUB_REF_NAME}"
            git push origin badges
          fi
