name: Screenshots (release tags)

# Regenerate the README / docs screenshots from the mock-driven UI and open a
# pull request with them. No backend needed — the generator drives the built
# SPA with Playwright and intercepts /api/** via page.route (see
# frontend/e2e/screenshots.spec.ts + fixtures/rich-mock.ts).
#
# Runs on version tags (v*) and manual dispatch only — not on every push.
#
# This used to push straight to main, which the `main-protection` ruleset has
# rejected since it started requiring pull requests ("GH013 ... Changes must
# be made through a pull request"). The failure was invisible: a red workflow
# on a release tag blocks nothing, so the screenshots silently went stale for
# four releases. Granting github-actions[bot] a bypass is not an option — the
# Actions bot is built in rather than an installed app, and the ruleset API
# rejects it with "Actor GitHub Actions integration must be part of the
# ruleset source or owner organization". So: open a PR instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: Generate & commit screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A tag is not a branch — check out main and commit the results there.
          # Version tags are normally cut from main HEAD, so this reflects the
          # released UI. NOTE: if main is a protected branch, allow the Actions
          # bot to push (or switch the final step to open a PR).
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build api-client
        run: pnpm --filter @tiqora/api-client build
      - name: Build frontend (served by Playwright's vite preview)
        run: pnpm --filter tiqora-frontend build
      - name: Install Playwright chromium
        run: pnpm --filter tiqora-frontend exec playwright install --with-deps chromium
      - name: Generate screenshots
        env:
          SCREENSHOTS: "1"
        run: pnpm --filter tiqora-frontend exec playwright test screenshots --project=chromium
      - name: Open a pull request with the regenerated screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi

          # Branch name carries the ref so two releases in quick succession
          # cannot collide on one branch.
          slug="$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
          branch="docs/screenshots-${slug}"

          # No [skip ci] here: branch protection expects the usual checks to
          # run on the PR, and a skipped run leaves it unmergeable.
          git commit -m "docs(screenshots): regenerate for ${GITHUB_REF_NAME}"

          # Plain --force, not --force-with-lease: a fresh CI checkout has no
          # remote-tracking ref for this branch, and the lease check then
          # fails with "stale info". The branch is bot-owned and per-tag, so
          # there is nothing to protect against here.
          git push --force origin "HEAD:refs/heads/${branch}"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR for $branch already open — the push updated it."
            exit 0
          fi
          body="Automatisch erzeugt vom Screenshots-Workflow fuer ${GITHUB_REF_NAME}."
          body="${body} Enthaelt ausschliesslich neu gerenderte PNGs unter docs/images/."
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs(screenshots): regenerate for ${GITHUB_REF_NAME}" \
            --body "$body"
