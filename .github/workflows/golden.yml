name: Golden-master (real peer vs Tiqora)

# Manual multi-peer toolkit only — no nightly, no PR gate.
# Building a full OTRS/Znuny container from source is heavy; run from the
# Actions tab when validating ticket numbering, history formats, escalation,
# or the GenericInterface compat layer. See docs/testing.md and
# tests/golden/README-multi-peer.md.
#
# Peer source trees (gitignored, e.g. znuny-6.5.22/) must exist in the
# workspace for the chosen peer(s). On GHA runners that usually means the
# default peer only works if a prior step or cache supplies the tree; local
# `just golden-all-peers` is the primary full-matrix path.
on:
  workflow_dispatch:
    inputs:
      peer:
        description: "Peer id from tests/golden/peers.yaml (ignored when run_all)"
        required: false
        default: "znuny-6.5"
        type: string
      run_all:
        description: "Run every peer whose source_dir is present (sequential)"
        required: false
        default: false
        type: boolean

# Voreinstellung fuer alle Jobs: nur lesen. Einzelne Jobs, die mehr
# brauchen, deklarieren das selbst.
permissions:
  contents: read

jobs:
  golden:
    name: Golden-master (${{ inputs.run_all && 'all ready peers' || inputs.peer }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: List peers / readiness
        run: |
          echo "All peers:"
          python3 tests/golden/peer_env.py --list
          echo "Ready (source present):"
          python3 tests/golden/peer_env.py --list-ready || true
      - name: Single peer — check source
        if: ${{ !inputs.run_all }}
        run: python3 tests/golden/peer_env.py --check "${{ inputs.peer }}"
      - name: Single peer — build + seed + test
        if: ${{ !inputs.run_all }}
        env:
          GOLDEN_PEER: ${{ inputs.peer }}
        run: |
          set -euo pipefail
          eval "$(python3 tests/golden/peer_env.py "${GOLDEN_PEER}")"
          export GOLDEN_PEER GOLDEN_SOURCE_DIR GOLDEN_COMPOSE_PROJECT
          export GOLDEN_DB_URL GOLDEN_DB_ASYNC_URL
          echo "peer=${GOLDEN_PEER} project=${GOLDEN_COMPOSE_PROJECT} source=${GOLDEN_SOURCE_DIR}"
          docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
            -f tests/golden/docker-compose.golden.yml up -d --build --wait
          docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
            -f tests/golden/docker-compose.golden.yml exec -T znuny \
            /usr/local/bin/znuny-entrypoint.sh console Maint::Config::Rebuild
          bash tests/golden/seed.sh
          (
            cd backend
            GOLDEN=1 \
              GOLDEN_PEER="${GOLDEN_PEER}" \
              GOLDEN_COMPOSE_PROJECT="${GOLDEN_COMPOSE_PROJECT}" \
              GOLDEN_DB_URL="${GOLDEN_DB_URL}" \
              uv run pytest -q -m golden ../tests/golden
          )
      - name: All ready peers — sequential matrix
        if: ${{ inputs.run_all }}
        run: |
          set -euo pipefail
          peers=()
          while IFS= read -r peer; do
            [ -n "${peer}" ] && peers+=("${peer}")
          done < <(python3 tests/golden/peer_env.py --list-ready)
          if [ "${#peers[@]}" -eq 0 ]; then
            echo "ERROR: no peers with source present on the runner." >&2
            echo "Place release trees at paths from peers.yaml (see README-multi-peer.md)." >&2
            exit 1
          fi
          echo "Running sequential golden for: ${peers[*]}"
          failed=()
          for peer in "${peers[@]}"; do
            echo ""
            echo "======== GOLDEN peer=${peer} ========"
            eval "$(python3 tests/golden/peer_env.py "${peer}")"
            export GOLDEN_PEER GOLDEN_SOURCE_DIR GOLDEN_COMPOSE_PROJECT
            export GOLDEN_DB_URL GOLDEN_DB_ASYNC_URL
            if docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
                 -f tests/golden/docker-compose.golden.yml up -d --build --wait \
              && docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
                 -f tests/golden/docker-compose.golden.yml exec -T znuny \
                 /usr/local/bin/znuny-entrypoint.sh console Maint::Config::Rebuild \
              && bash tests/golden/seed.sh \
              && (cd backend && GOLDEN=1 \
                    GOLDEN_PEER="${GOLDEN_PEER}" \
                    GOLDEN_COMPOSE_PROJECT="${GOLDEN_COMPOSE_PROJECT}" \
                    GOLDEN_DB_URL="${GOLDEN_DB_URL}" \
                    uv run pytest -q -m golden ../tests/golden); then
              echo "OK ${peer}"
            else
              echo "FAIL ${peer}" >&2
              failed+=("${peer}")
              docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
                -f tests/golden/docker-compose.golden.yml logs znuny mariadb || true
            fi
            docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
              -f tests/golden/docker-compose.golden.yml down -v || true
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed peers: ${failed[*]}" >&2
            exit 1
          fi
      - name: Dump peer container logs on failure
        if: ${{ failure() && !inputs.run_all }}
        env:
          GOLDEN_PEER: ${{ inputs.peer }}
        run: |
          eval "$(python3 tests/golden/peer_env.py "${GOLDEN_PEER}")"
          docker compose -p "${GOLDEN_COMPOSE_PROJECT}" \
            -f tests/golden/docker-compose.golden.yml logs znuny mariadb || true
      - name: Tear down
        if: ${{ always() && !inputs.run_all }}
        env:
          GOLDEN_PEER: ${{ inputs.peer }}
        run: |
          eval "$(python3 tests/golden/peer_env.py "${GOLDEN_PEER}")" || true
          docker compose -p "${GOLDEN_COMPOSE_PROJECT:-tiqora-golden-znuny-6-5}" \
            -f tests/golden/docker-compose.golden.yml down -v || true
