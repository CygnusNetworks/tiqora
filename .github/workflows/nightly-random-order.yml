name: Nightly (random test order)

# The suite runs in a fixed alphabetical order, and the DB testcontainers are
# session-scoped, so any test that depends on what an earlier test left behind
# passes every time -- until an unrelated PR adds a file that sorts in between.
# That is exactly how 32 tests broke at once in July 2026.
#
# This job shuffles the order on purpose so order-dependence surfaces as a
# nightly failure with a reproducible seed, rather than as a merge-day
# surprise. Deliberately NOT part of the PR gate: a shuffled run can fail for
# reasons a PR author did not cause, and a gate that is red for someone else's
# reason gets ignored.
#
# Shuffles the order of test FILES only, keeping each file's own order intact
# (TIQORA_SHUFFLE_MODULES, implemented in tests/conftest.py). That matches the
# isolation contract: state is restored between modules, so within a file the
# author controls the ids and may deliberately build on the previous test.
#
# Neither pytest-randomly nor pytest-random-order can express this.
# --random-order-bucket=module reads like it does, but it only guarantees that
# a test does not leave its module -- inside the module it still reorders, and
# the resulting intra-file failures bury the cross-module signal.
#
# To reproduce a failure locally, take the seed from the log line
# "Module order shuffled with TIQORA_SHUFFLE_MODULES=<seed>":
#   TIQORA_SHUFFLE_MODULES=<seed> uv run pytest -q

on:
  schedule:
    # 03:17 UTC -- off the hour, so it does not queue behind everyone else's
    # midnight cron on the shared runner pool.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Fixed seed to reproduce a previous failure (blank = random)"
        type: string
        default: ""

concurrency:
  group: nightly-random-order
  cancel-in-progress: true

jobs:
  random-order:
    name: Backend tests (shuffled)
    runs-on: ubuntu-latest
    # A shuffled run can expose a hang that the ordered run never hits.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: tiqora-dev-master-key
      TIQORA_ENV: test
      TIQORA_STRICT_DB_LEAKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crypto tooling (gpg for PGP tests; openssl is preinstalled)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg
      - name: Install dependencies
        run: uv sync --extra dev --extra crypto
      # The seed defaults to the run id: different every night, and printed in
      # the log so a failure can be replayed exactly.
      - name: Pytest (shuffled module order)
        env:
          TIQORA_SHUFFLE_MODULES: ${{ inputs.seed || github.run_id }}
        run: uv run pytest -q
