# Bekannte, bewusst zurueckgestellte Funde des OSV-Scanners.
#
# Sinn dieser Datei: der Supply-Chain-Workflow soll GRUEN starten. Ein Scanner,
# der wegen Altlasten dauerhaft rot steht, wird nach zwei Wochen ignoriert --
# und genau dann uebersieht man den einen Fund, auf den es ankommt.
#
# Jeder Eintrag hat ein ignoreUntil. Danach schlaegt der Scan wieder an, der
# Fund kommt also automatisch zurueck auf den Tisch statt still zu verschwinden.
# Neue Funde sind von dieser Datei nicht betroffen und brechen den Workflow
# sofort.
#
# Stand 2026-11-03: ein Fund zurueckgestellt (minimatch, siehe unten). Neue
# zurueckgestellte Funde als [[IgnoredVulns]] mit id, ignoreUntil und reason
# hier eintragen.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-01
reason = """minimatch 3.1.5 (eslint), 5.1.9 (@redocly/openapi-core) und 10.2.6
(@typescript-eslint/typescript-estree): DoS durch ein boesartiges Glob-Muster.
Nur Entwicklerwerkzeuge mit Mustern aus unserer eigenen Konfiguration, nichts
davon landet im Image. Behoben ist es erst in minimatch 11; ein Override ueber
die Hauptversion hinweg bricht die CJS-Aufrufer (v3/v5) und widerspricht der
Override-Regel in pnpm-workspace.yaml. Wieder pruefen, sobald eslint,
typescript-eslint und redocly minimatch 11 mitbringen."""
