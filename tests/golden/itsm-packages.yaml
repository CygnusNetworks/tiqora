# Znuny ITSM packages for the golden ITSM peers (I15, wave-4 itsm-core).
#
# One list per BASE peer (peers.yaml `base:`). Order matters: dependencies first.
# `sha256` is recorded with `fetch_itsm_packages.py <peer> --record` on first fetch and is
# verified on every later fetch (a mismatch fails). Official download location:
# https://download.znuny.org/releases/itsm/ (7.x: latest/, bundle7/; 6.x: bundle6x/).
#
# Znuny publishes no individual 6.5 packages any more, only the ITSM bundle
# (`ITSM-6.5.3.opm` embeds GeneralCatalog, ITSMCore, ITSMIncidentProblemManagement,
# ITSMConfigurationManagement, ImportExport, ITSMChangeManagement and
# ITSMServiceLevelManagement under var/packagesetup/ITSM/ and installs them itself).
# `provides` lists what `Admin::Package::List` must show as installed afterwards.
#
# Fallback if a download disappears: build the .opm from the github.com/znuny/<Package>
# tag with `Dev::Package::Build` inside the base peer (see README-multi-peer.md, "ITSM peers").

znuny-6.5:
  provides:
    - GeneralCatalog
    - ITSMCore
    - ITSMIncidentProblemManagement
    - ITSMConfigurationManagement
    - ImportExport
    - ITSMChangeManagement
    - ITSMServiceLevelManagement
  packages:
    - name: ITSM
      version: 6.5.3
      url: https://download.znuny.org/releases/itsm/bundle6x/ITSM-6.5.3.opm
      sha256: "2f011e2dc307829eb5804881d04bab8d41b9ec63f2320351959a8f1957c5aa20"

