# Multi-peer golden stack (manual only). Project name isolates volumes per peer.
#
#   eval "$(python3 tests/golden/peer_env.py znuny-6.5)"
#   docker compose -p "$GOLDEN_COMPOSE_PROJECT" -f tests/golden/docker-compose.golden.yml up -d --build --wait
#
# Or: just golden-up  (uses GOLDEN_PEER, default znuny-6.5)
# Project name is set via `docker compose -p` (see peer_env GOLDEN_COMPOSE_PROJECT).
# Avoid embedding peer ids with dots here — Compose rejects them in `name:`.
name: tiqora-golden

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: znuny
      MYSQL_USER: znuny
      MYSQL_PASSWORD: znuny
    ports:
      - "3307:3306"
    volumes:
      - tiqora_golden_mariadb_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  znuny:
    build:
      context: ../..
      dockerfile: tests/golden/Dockerfile.znuny
      args:
        SOURCE_DIR: ${GOLDEN_SOURCE_DIR:-znuny-6.5.22}
    image: tiqora-golden-peer-${GOLDEN_PEER:-znuny-6.5}
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: znuny
      DB_USER: znuny
      DB_PASSWORD: znuny
      DB_ROOT_PASSWORD: root
      ZNUNY_FQDN: znuny.golden.local
      ZNUNY_SYSTEM_ID: "10"
      GOLDEN_PEER: ${GOLDEN_PEER:-znuny-6.5}
    ports:
      - "8180:80"
    # Accept either classic /otrs/ or /znuny/ ScriptAlias depending on peer tree.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/otrs/index.pl >/dev/null 2>&1 || curl -fsS http://127.0.0.1/znuny/index.pl >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 36
      start_period: 90s

volumes:
  tiqora_golden_mariadb_data:
