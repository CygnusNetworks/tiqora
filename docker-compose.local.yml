# Tiqora — full local dev stack, everything in containers.
#
#   docker compose -f docker-compose.local.yml up --build -d
#   → open http://localhost:8000  (login: root@localhost / admin)
#
# Builds the app image from THIS checkout (backend + SPA) so you can test
# changes locally without pushing anywhere. The `init` service bootstraps a
# fresh MariaDB (Znuny base schema → tiqora migrations → admin password) and
# seeds fake customers/tickets, then exits; the app services start after it.
#
# Apply code changes:   docker compose -f docker-compose.local.yml up --build -d
# Re-seed from scratch:  docker compose -f docker-compose.local.yml down -v && … up --build -d
#
# This is the "run the whole thing" option. For fast hot-reload backend/frontend
# work, use docker-compose.dev.yml (infra only) + `uv run` / `pnpm dev` on the
# host instead — see docs/development.md.
#
# MariaDB is used here to match production (Znuny 6.5 on MariaDB). Swap the db
# service + DATABASE_URL for postgres:16 if you prefer.
#
# Runs as its own compose project (`tiqora-local`) with its own containers and
# volumes, and uses non-default host ports where needed, so it can run
# alongside docker-compose.dev.yml without collisions.

name: tiqora-local

x-app-env: &app-env
  DATABASE_URL: mysql+aiomysql://tiqora:tiqora@mariadb:3306/tiqora
  REDIS_URL: redis://redis:6379/0
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: tiqora-dev-master-key
  TIQORA_SECRET_KEY: dev-secret-not-for-production-change-me
  TIQORA_ENV: development
  TIQORA_LOG_LEVEL: INFO
  # Local HTTP — no TLS, so session cookies must not be Secure-only.
  TIQORA_SESSION_COOKIE_SECURE: "false"
  TIQORA_CORS_ORIGINS: http://localhost:8000

x-app-build: &app-build
  build:
    context: .
  image: tiqora-local:dev

services:
  mariadb:
    image: mariadb:10.11
    container_name: tiqora-local-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tiqora
      MYSQL_USER: tiqora
      MYSQL_PASSWORD: tiqora
    volumes:
      - tiqora_local_mariadb:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: tiqora-local-redis
    volumes:
      - tiqora_local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: tiqora-local-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: tiqora-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - tiqora_local_meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tiqora-local-mailpit
    # Host ports 1026/8026 (not the Mailpit defaults 1025/8025) so this stack
    # can run alongside docker-compose.dev.yml's Mailpit without clashing. The
    # app still reaches it in-network at mailpit:1025.
    ports:
      - "127.0.0.1:1026:1025" # SMTP (point outbound mail here via /admin/mail-outbound)
      - "127.0.0.1:8026:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # One-shot: load Znuny base schema → tiqora migrations → admin password, then
  # seed fake customers/tickets ONCE. Runs on every `up` (the app services gate
  # on it completing), so it must be idempotent: `bootstrap` (no --seed) is
  # safe to repeat, and the seed is guarded by a sentinel in a named volume so
  # a second run doesn't duplicate the fixed-RNG data (which would fail).
  init:
    <<: *app-build
    container_name: tiqora-local-init
    restart: "no"
    # Root so the one-shot can write the seed sentinel into the (root-owned)
    # named volume; the app image otherwise runs as a non-root user.
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python -m tiqora.main bootstrap --admin-password admin &&
        if [ ! -f /seed-state/.seeded ]; then
          echo "Seeding fake customers/tickets…" &&
          python -m tiqora.main dev seed --customers 12 --tickets 40 --seed 42 &&
          touch /seed-state/.seeded;
        else
          echo "Already seeded — skipping (rm the tiqora_local_seed volume to re-seed).";
        fi
    environment:
      <<: *app-env
    volumes:
      - tiqora_local_seed:/seed-state
    depends_on:
      mariadb:
        condition: service_healthy

  tiqora-api:
    <<: *app-build
    container_name: tiqora-local-api
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *app-env
      # init already migrated; skip the entrypoint's migrate step to start faster.
      TIQORA_RUN_MIGRATIONS: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  tiqora-worker:
    <<: *app-build
    container_name: tiqora-local-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *app-env
    depends_on:
      tiqora-api:
        condition: service_started

  tiqora-ai-worker:
    <<: *app-build
    container_name: tiqora-local-ai-worker
    restart: unless-stopped
    command: ["ai-worker"]
    environment:
      <<: *app-env
    depends_on:
      tiqora-api:
        condition: service_started

  tiqora-mcp:
    <<: *app-build
    container_name: tiqora-local-mcp
    restart: unless-stopped
    command: ["mcp"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      tiqora-api:
        condition: service_started

volumes:
  tiqora_local_mariadb:
  tiqora_local_redis:
  tiqora_local_meili:
  tiqora_local_seed:
